<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password – Eligald Admin</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0A3D0F;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon-circle {
      width: 56px; height: 56px;
      background: #F1F8E9; color: #2E7D32;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; margin-bottom: 20px;
    }
    h1 { font-size: 1.3rem; color: #2D2D2D; margin-bottom: 8px; }
    p.sub { font-size: 0.88rem; color: #6B7280; margin-bottom: 24px; line-height: 1.6; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: #444; margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #E0E0E0; border-radius: 10px;
      font-size: 0.9rem;
    }
    input:focus { outline: none; border-color: #4CAF50; }
    button {
      width: 100%; padding: 12px;
      background: #2E7D32; color: #fff;
      border: none; border-radius: 10px;
      font-size: 0.92rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #1B5E20; }
    .message {
      background: #F1F8E9; color: #2E7D32;
      padding: 14px; border-radius: 10px;
      font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5;
    }
    .back-link {
      display: block; text-align: center; margin-top: 20px;
      font-size: 0.85rem; color: #6B7280; text-decoration: none;
    }
    .back-link:hover { color: #2E7D32; }
    .method-toggle { display: flex; gap: 10px; margin-top: 4px; }
    .method-option {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 10px; border: 1.5px solid #E0E0E0; border-radius: 10px;
      cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #666;
      transition: all 0.2s;
    }
    .method-option input { display: none; }
    .method-option:has(input:checked) {
      border-color: #4CAF50; background: #F1F8E9; color: #2E7D32;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-circle"><i class="fas fa-key"></i></div>
    <h1>Reset your password</h1>
    <p class="sub">Enter your admin username. If your account has an email on file, we'll send a reset link.</p>

    {% if message %}
    <div class="message"><i class="fas fa-check-circle me-2"></i>{{ message }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('admin_bp.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Your admin username" required autofocus/>
      </div>
      <div class="form-group">
        <label>Reset via</label>
        <div class="method-toggle">
          <label class="method-option">
            <input type="radio" name="method" value="email" checked/>
            <span><i class="fas fa-envelope me-1"></i>Email</span>
          </label>
          <label class="method-option">
            <input type="radio" name="method" value="whatsapp"/>
            <span><i class="fab fa-whatsapp me-1"></i>WhatsApp</span>
          </label>
        </div>
      </div>
      <button type="submit"><i class="fas fa-paper-plane me-2"></i>Send Reset Code</button>
    </form>

    <a href="{{ url_for('admin_bp.login') }}" class="back-link">
      <i class="fas fa-arrow-left me-1"></i>Back to Login
    </a>
  </div>
</body>
</html>
