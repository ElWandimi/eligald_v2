<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password – Eligald Admin</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0A3D0F;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon-circle {
      width: 56px; height: 56px;
      background: #F1F8E9; color: #2E7D32;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; margin-bottom: 20px;
    }
    h1 { font-size: 1.3rem; color: #2D2D2D; margin-bottom: 8px; }
    p.sub { font-size: 0.88rem; color: #6B7280; margin-bottom: 24px; line-height: 1.6; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: #444; margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #E0E0E0; border-radius: 10px;
      font-size: 0.9rem;
    }
    input:focus { outline: none; border-color: #4CAF50; }
    button {
      width: 100%; padding: 12px;
      background: #2E7D32; color: #fff;
      border: none; border-radius: 10px;
      font-size: 0.92rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #1B5E20; }
    .error {
      background: #FFEBEE; color: #C62828;
      padding: 14px; border-radius: 10px;
      font-size: 0.85rem; margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-circle"><i class="fas fa-lock"></i></div>
    <h1>Set a new password</h1>
    <p class="sub">Choose a strong password with at least 8 characters.</p>

    {% if error %}
    <div class="error"><i class="fas fa-exclamation-circle me-2"></i>{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('admin_bp.reset_password_otp') if via_whatsapp else url_for('admin_bp.reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" required minlength="8" autofocus/>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8"/>
      </div>
      <button type="submit"><i class="fas fa-check me-2"></i>Update Password</button>
    </form>
  </div>
</body>
</html>
